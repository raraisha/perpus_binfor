<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinjam Buku - Perpustakaan SMK Bina Informatika</title>
  <script src="../navbar.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4B7FF2; --primary-soft: #eef3ff; --accent: #B36FF2; --accent-soft: #f7f0ff;
      --green: #10b981; --green-soft: #ecfdf5; --orange: #f59e0b; --orange-soft: #fffbeb;
      --red: #ef4444; --red-soft: #fef2f2; --white: #ffffff; --gray: #f1f5f9;
      --text: #0f172a; --muted: #64748b; --border: #e2e8f0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--gray); color: var(--text); min-height: 100vh; }
    .main { max-width: 820px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

    /* STEPS */
    .steps { display: flex; align-items: center; justify-content: space-between; background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 1.1rem 1.75rem; margin-bottom: 1.75rem; }
    .step { display: flex; align-items: center; gap: 0.65rem; flex: 1; }
    .step-num { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 800; border: 2px solid var(--border); background: var(--gray); color: var(--muted); }
    .step.active .step-num { background: linear-gradient(135deg, var(--accent), var(--primary)); color: white; border: none; }
    .step.done .step-num { background: var(--green); color: white; border: none; }

    /* CARDS */
    .card { background: var(--white); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; margin-bottom: 1.25rem; }
    .card-head { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .card-head h2 { font-size: 0.88rem; font-weight: 800; }
    .card-body { padding: 1.25rem 1.5rem; }

    /* SEARCH */
    .search-row { display: flex; gap: 0.6rem; margin-bottom: 1rem; }
    .search-input { flex: 1; border: 1.5px solid var(--border); border-radius: 10px; padding: 0.68rem 1rem; background: var(--gray); outline: none; font-family: inherit; }
    .btn-search { background: linear-gradient(135deg, var(--accent), var(--primary)); color: white; border: none; padding: 0.68rem 1.35rem; border-radius: 10px; font-weight: 700; cursor: pointer; }
    .results-wrap { display: none; margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem; }
    .results-wrap.show { display: block; }
    .result-item { display: flex; align-items: center; gap: 1rem; padding: 0.85rem; border: 1.5px solid var(--border); border-radius: 12px; cursor: pointer; margin-bottom: 0.5rem; transition: 0.2s; }
    .result-item:hover { border-color: var(--primary); background: var(--primary-soft); }
    .result-item.selected { border-color: var(--primary); background: var(--primary-soft); }
    .result-radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; }
    .result-item.selected .result-radio { background: var(--primary); border-color: var(--primary); box-shadow: inset 0 0 0 3px white; }

    /* FORM */
    .form-card { opacity: 0.4; pointer-events: none; transition: 0.3s; }
    .form-card.enabled { opacity: 1; pointer-events: all; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-label { font-size: 0.75rem; font-weight: 700; color: var(--muted); }
    .form-input { border: 1.5px solid var(--border); border-radius: 10px; padding: 0.7rem; background: var(--gray); font-family: inherit; }
    .form-input[readonly] { background: #f8f9fb; cursor: not-allowed; }

    /* SUMMARY & SUBMIT */
    .summary-box { background: var(--gray); border-radius: 12px; padding: 1rem; margin-bottom: 1.25rem; display: none; }
    .summary-box.show { display: block; }
    .sum-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 0.3rem 0; border-bottom: 1px dashed #d1d5db; }
    .btn-submit { width: 100%; background: linear-gradient(135deg, var(--accent), var(--primary)); color: white; border: none; padding: 1rem; border-radius: 12px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 15px rgba(107,115,230,0.3); }
    .btn-submit:disabled { opacity: 0.5; transform: none; cursor: not-allowed; }

    /* SUCCESS MODAL */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(8px); z-index: 999; align-items: center; justify-content: center; }
    .overlay.show { display: flex; }
    .success-box { background: white; border-radius: 24px; padding: 2.5rem; text-align: center; max-width: 380px; width: 90%; }
  </style>
</head>
<body>

<navbar-component></navbar-component>

<div class="main">
  <div class="steps">
    <div class="step active" id="step1">
      <div class="step-num">1</div>
      <div style="margin-left:0.5rem;"><div style="font-size:0.75rem; font-weight:800;">Cari Buku</div></div>
    </div>
    <div class="step" id="step2">
      <div class="step-num">2</div>
      <div style="margin-left:0.5rem;"><div style="font-size:0.75rem; font-weight:800;">Isi Data</div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2>🔍 Pilih Buku dari Perpustakaan</h2></div>
    <div class="card-body">
      <div class="search-row">
        <input type="text" class="search-input" id="searchInput" placeholder="Ketik judul buku...">
        <button class="btn-search" onclick="doSearch()">Cari</button>
      </div>
      <div class="results-wrap" id="resultsWrap">
        <div id="resultsGrid"></div>
      </div>
    </div>
  </div>

  <div class="card form-card" id="formCard">
    <div class="card-head"><h2>📝 Detail Peminjaman</h2></div>
    <div class="card-body">
      <div class="form-grid">
        <div class="form-group" style="grid-column: 1/-1;">
          <label class="form-label">Judul Buku</label>
          <input type="text" id="fieldJudul" class="form-input" readonly>
        </div>
        <div class="form-group">
          <label class="form-label">Nama Peminjam</label>
          <input type="text" id="fieldNama" class="form-input" readonly>
        </div>
        <div class="form-group">
          <label class="form-label">NIS (ID)</label>
          <input type="text" id="fieldId" class="form-input" readonly>
        </div>
        <div class="form-group">
          <label class="form-label">Tanggal Pinjam</label>
          <input type="date" id="fieldTglPinjam" class="form-input" readonly>
        </div>
        <div class="form-group">
          <label class="form-label">Batas Kembali</label>
          <input type="date" id="fieldTglKembali" class="form-input" readonly>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="border:none; background:transparent;">
    <div class="summary-box" id="summaryBox">
      <div class="sum-row"><span>Buku</span><span id="sumJudul" style="font-weight:700; color:var(--primary);">—</span></div>
      <div class="sum-row"><span>Peminjam</span><span id="sumNama" style="font-weight:700;">—</span></div>
    </div>
    <button class="btn-submit" id="btnSubmit" disabled onclick="submitForm()">Ajukan Peminjaman →</button>
  </div>
</div>

<div class="overlay" id="successOverlay">
  <div class="success-box">
    <div style="font-size:3.5rem; margin-bottom:1rem;">✅</div>
    <h2 style="margin-bottom:0.5rem;">Peminjaman Berhasil!</h2>
    <p style="color:var(--muted); font-size:0.9rem; margin-bottom:1.5rem;">Silakan ambil buku kamu di ruang perpustakaan.</p>
    <button onclick="window.location.href='index.html'" style="width:100%; padding:0.8rem; border-radius:12px; border:none; background:var(--primary); color:white; font-weight:700; cursor:pointer;">Ke Dashboard</button>
  </div>
</div>

<script type="module">
  import { db } from "../firebase.js";
  import { collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 1. Inisialisasi Data Siswa dari Session (Sesuai Gambar 1)
  const userData = JSON.parse(sessionStorage.getItem("userActive"));
  if (!userData) window.location.href = "../login.html";

  // Perbaikan Get ID: Di database kamu NIS ada di field 'password'
  const namaSiswa = userData.nama || "Siswa";
  const nisSiswa  = userData.password || "—";
  const kelasSiswa = userData.kelas || "—";

  document.getElementById("fieldNama").value = namaSiswa;
  document.getElementById("fieldId").value = nisSiswa;

  // Set Tanggal Otomatis (+7 Hari)
  const now = new Date();
  const deadline = new Date();
  deadline.setDate(now.getDate() + 7);
  document.getElementById("fieldTglPinjam").value = now.toISOString().split('T')[0];
  document.getElementById("fieldTglKembali").value = deadline.toISOString().split('T')[0];

  let selectedBook = null;

  // 2. Fungsi Cari Buku (Sesuai Gambar 2)
window.doSearch = async () => {
  const q = document.getElementById("searchInput").value.trim();
  if (!q) return;

  const grid = document.getElementById("resultsGrid");
  grid.innerHTML = "<p style='font-size:0.8rem; color:var(--muted);'>Mencari buku...</p>";
  document.getElementById("resultsWrap").classList.add("show");

  try {
    const snap = await getDocs(collection(db, "buku"));
    const allBooks = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

    const filtered = allBooks.filter(b => {
      // Ambil nilai judul secara fleksibel (cek JUDUL BUKU, judul, atau Judul)
      const judul = b["JUDUL BUKU"] || b["judul"] || b["Judul"] || "";
      return judul.toLowerCase().includes(q.toLowerCase());
    });

    if (filtered.length === 0) {
      grid.innerHTML = "<p style='font-size:0.8rem;'>Buku tidak ditemukan.</p>";
      return;
    }

    grid.innerHTML = filtered.map(b => {
      // Deteksi field secara dinamis agar tidak "Tanpa Judul" lagi
      const judulAsli = b["JUDUL BUKU"] || b["judul"] || b["Judul"] || "Judul Kosong";
      const penerbitAsli = b["PENERBIT"] || b["penerbit"] || b["Penerbit"] || "Penerbit Kosong";

      // Pengaman untuk karakter kutipan agar tidak error saat diklik
      const judulSafe = judulAsli.replace(/'/g, "\\'");
      const penerbitSafe = penerbitAsli.replace(/'/g, "\\'");

      return `
        <div class="result-item" onclick="selectBook('${b.id}', '${judulSafe}', '${penerbitSafe}')" id="ri-${b.id}">
          <div class="result-radio"></div>
          <div style="flex:1">
            <div style="font-weight:700; font-size:0.9rem;">${judulAsli}</div>
            <div style="font-size:0.75rem; color:var(--muted);">${penerbitAsli}</div>
          </div>
        </div>
      `;
    }).join("");

  } catch (err) {
    console.error(err);
    grid.innerHTML = "<p>Terjadi kesalahan: " + err.message + "</p>";
  }
};

  // 3. Fungsi Pilih Buku
  window.selectBook = (id, judul, penerbit) => {
    selectedBook = { id, judul, penerbit };
    
    // UI Update
    document.querySelectorAll(".result-item").forEach(el => el.classList.remove("selected"));
    document.getElementById(`ri-${id}`).classList.add("selected");
    
    // Form Update
    document.getElementById("fieldJudul").value = judul;
    document.getElementById("formCard").classList.add("enabled");
    document.getElementById("summaryBox").classList.add("show");
    document.getElementById("sumJudul").innerText = judul;
    document.getElementById("sumNama").innerText = namaSiswa;
    
    // Button & Steps
    document.getElementById("btnSubmit").disabled = false;
    document.getElementById("step1").classList.add("done");
    document.getElementById("step1").querySelector(".step-num").innerText = "✓";
    document.getElementById("step2").classList.add("active");
  };

  // 4. Fungsi Kirim Data ke Koleksi 'peminjaman'
  window.submitForm = async () => {
    if (!selectedBook) return;
    const btn = document.getElementById("btnSubmit");
    btn.disabled = true;
    btn.innerText = "Memproses...";

    try {
      await addDoc(collection(db, "peminjaman"), {
        siswa_id: nisSiswa,    // Contoh: 23173059
        nama: namaSiswa,       // Contoh: Raisha Afiqah
        kelas: kelasSiswa,     // Contoh: XII RPL
        buku_id: selectedBook.id,
        judul: selectedBook.judul,
        penerbit: selectedBook.penerbit,
        tgl_pinjam: serverTimestamp(),
        tgl_kembali: deadline,
        status: "dipinjam",
        denda: 0,
        created_at: serverTimestamp()
      });

      document.getElementById("successOverlay").classList.add("show");
    } catch (err) {
      console.error(err);
      alert("Gagal mengajukan peminjaman: " + err.message);
      btn.disabled = false;
      btn.innerText = "Ajukan Peminjaman →";
    }
  };

  // Trigger search saat enter
  document.getElementById("searchInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") doSearch();
  });
</script>

</body>
</html>
